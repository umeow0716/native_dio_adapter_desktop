name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Ubuntu 22.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and desktop dependencies
        run: |
          apt-get update
          apt-get install -y curl git jq unzip xz-utils clang cmake ninja-build pkg-config libgtk-3-dev libgl1-mesa-dri libegl1 libgles2 xvfb xauth
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: '3.47.6'
          architecture: x64
      # The release archive manifest has no Linux ARM64 entry for this version.
      # Flutter's source installer downloads the matching ARM64 Dart/engine.
      - name: Install Flutter SDK from source on ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          flutterSdk="$RUNNER_TEMP/flutter-arm64"
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$flutterSdk"
          echo "FLUTTER_ROOT=$flutterSdk" >> "$GITHUB_ENV"
          echo "$flutterSdk/bin" >> "$GITHUB_PATH"
      - name: Trust Flutter SDK ownership inside container
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: python3 scripts/check_native_platforms.py example/.flutter-plugins-dependencies
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - name: Build native example
        working-directory: example
        run: flutter build linux --release
      - name: Native HTTP, TLS and proxy smoke tests
        working-directory: example
        run: xvfb-run -a build/linux/${{ matrix.arch }}/release/bundle/native_desktop_example --smoke-test
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
      - run: flutter pub get
      - run: python scripts/check_native_platforms.py example/.flutter-plugins-dependencies
      - run: flutter analyze
      - run: flutter test
      - name: Build native example
        working-directory: example
        run: flutter build windows --release
      - name: Verify Rust is absent from the Windows bundle
        working-directory: example
        shell: pwsh
        run: |
          if (Get-ChildItem build/windows/x64/runner/Release -Recurse -Filter '*rhttp*') {
            throw 'Windows bundle contains an unexpected Rust backend.'
          }
      - name: Native HTTP, TLS and proxy smoke tests
        working-directory: example
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'build/windows/x64/runner/Release/native_desktop_example.exe' -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput 'smoke.stdout.log' -RedirectStandardError 'smoke.stderr.log'
          Get-Content 'smoke.stdout.log'
          Get-Content 'smoke.stderr.log'
          if ($process.ExitCode -ne 0) { throw "Smoke tests failed: $($process.ExitCode)" }
